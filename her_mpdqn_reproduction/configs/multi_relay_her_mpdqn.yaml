experiment:
  algorithm: her_mpdqn
  environment: multi_relay
  seed: 0
  output_dir: outputs/multi_relay_her_mpdqn/seed_0
env:
  boundary_mode: clip
  num_relays: 1
  map_size: 2000.0
  goal_radius: 100.0
  relay_radius: 100.0
  max_episode_steps: 200
  min_start_goal_distance: 200.0
  require_catch_action: true
agent:
  hidden_sizes: [256, 128, 64]
  gamma: 0.99
  tau: 0.01
  q_learning_rate: 0.001
  parameter_learning_rate: 0.00001
  gradient_clip_norm: 10.0
  device: cpu
replay:
  capacity: 300000
  her_k: 4
  phase_aware: true
training:
  episodes: 30000
  learning_starts: 2000
  batch_size: 128
  update_schedule:
    mode: paper_dynamic
    reference_episode_length: 100
    min_multiplier: 1
    max_multiplier: 10
  checkpoint_every: 2000
  validation_every: 2000
  validation_episodes: 100
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  parameter_noise_start: 0.5
  parameter_noise_end: 0.05
  decay_steps: 500000
