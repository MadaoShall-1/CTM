experiment:
  algorithm: pdqn
  environment: direct
  seed: 0
  output_dir: outputs/direct_pdqn/seed_0
env:
  boundary_mode: clip
  map_size: 2000.0
  goal_radius: 100.0
  max_episode_steps: 100
  min_start_goal_distance: 400.0
agent:
  hidden_sizes: [128, 64]
  gamma: 0.99
  tau: 0.01
  q_learning_rate: 0.01
  parameter_learning_rate: 0.001
  gradient_clip_norm: 10.0
  device: cpu
replay:
  capacity: 50000
  her_k: 0
  phase_aware: false
training:
  episodes: 2000
  learning_starts: 1000
  batch_size: 128
  update_schedule:
    mode: paper_fixed
    multiplier: 40
  checkpoint_every: 200
  validation_every: 200
  validation_episodes: 100
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  parameter_noise_start: 0.5
  parameter_noise_end: 0.05
  decay_steps: 100000
