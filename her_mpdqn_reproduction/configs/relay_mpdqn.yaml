experiment:
  algorithm: mpdqn
  environment: relay
  seed: 0
  output_dir: outputs/relay_mpdqn/seed_0
env:
  boundary_mode: clip
  map_size: 2000.0
  goal_radius: 100.0
  relay_radius: 100.0
  max_episode_steps: 100
  min_start_goal_distance: 400.0
  require_catch_action: true
agent:
  hidden_sizes: [256, 128, 64]
  gamma: 0.99
  tau: 0.01
  q_learning_rate: 0.001
  parameter_learning_rate: 0.00001
  gradient_clip_norm: 10.0
  device: auto
replay:
  capacity: 150000
  her_k: 0
  phase_aware: false
training:
  episodes: 30000
  learning_starts: 2000
  batch_size: 128
  update_every: 1
  gradient_steps: 1
  checkpoint_every: 500
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  parameter_noise_start: 0.5
  parameter_noise_end: 0.05
  decay_steps: 500000
